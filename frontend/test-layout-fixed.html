<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Layout Fixed - AI Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #f0f0f0;
            background: #fafafa;
            flex-shrink: 0;
            min-height: 60px;
        }
        .chat-title {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            color: #262626;
            flex-shrink: 0;
        }
        .chat-title .icon {
            margin-right: 8px;
            color: #1890ff;
            font-size: 20px;
            line-height: 1;
        }
        .chat-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .btn {
            padding: 8px 16px;
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            color: #262626;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #1890ff;
            color: white;
            border-color: #1890ff;
        }
        .iframe-container {
            height: 600px;
            position: relative;
            background: #f5f5f5;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .test-info {
            padding: 16px;
            background: #f0f8ff;
            border-bottom: 1px solid #d9d9d9;
            font-size: 14px;
            color: #666;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .chat-header {
                padding: 12px 16px;
                min-height: 56px;
            }
            
            .chat-title {
                font-size: 16px;
            }
            
            .chat-title .icon {
                font-size: 18px;
            }
        }

        @media (max-width: 600px) {
            .chat-header {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
                padding: 16px;
                min-height: auto;
            }
            
            .chat-title {
                justify-content: center;
            }
            
            .chat-actions {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .chat-header {
                padding: 12px;
            }
            
            .chat-title {
                font-size: 15px;
            }
            
            .chat-title .icon {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-info">
            <strong>Layout Test:</strong> 调整了AI Assistant页面的header布局，确保在不同屏幕尺寸下按钮和标题都能正确对齐。
            <br>请尝试调整浏览器窗口大小来测试响应式布局。
        </div>
        
        <div class="chat-header">
            <div class="chat-title">
                <span class="icon">🤖</span>
                <span>AI Assistant</span>
            </div>
            <div class="chat-actions">
                <button class="btn btn-primary">
                    <span>📄</span>
                    Create PR
                </button>
            </div>
        </div>
        
        <div class="iframe-container">
            <iframe
                src="http://localhost/chatbot/HHOn2vBJZJHHTSug"
                style="width: 100%; height: 100%; min-height: 600px"
                frameborder="0"
                allow="microphone"
            ></iframe>
        </div>
    </div>

    <script>
        // 添加一些交互测试
        document.querySelector('.btn-primary').addEventListener('click', function() {
            alert('Create PR button clicked! Layout is working correctly.');
        });

        // 监听窗口大小变化
        window.addEventListener('resize', function() {
            console.log('Window resized to:', window.innerWidth + 'x' + window.innerHeight);
        });
    </script>
</body>
</html>
