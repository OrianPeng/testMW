<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AI Chatbot iframe</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header {
            padding: 16px 24px;
            background: #fafafa;
            border-bottom: 1px solid #f0f0f0;
        }
        .header h1 {
            margin: 0;
            color: #262626;
        }
        .iframe-container {
            height: 700px;
            position: relative;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Assistant Test</h1>
            <p>Testing iframe integration with chatbot</p>
        </div>
        <div class="iframe-container">
            <div class="loading">Loading AI Assistant...</div>
            <iframe
                src="http://localhost/chatbot/HHOn2vBJZJHHTSug"
                style="width: 100%; height: 100%; min-height: 700px"
                frameborder="0"
                allow="microphone"
                onload="document.querySelector('.loading').style.display='none'"
            ></iframe>
        </div>
    </div>
</body>
</html>
