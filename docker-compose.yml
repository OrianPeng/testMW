version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: rpa-middleware-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rpa-network

  rpa-middleware:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpa-middleware-app
    ports:
      - "8081:8081"
    environment:
      - QUEUE_TYPE=redis
      - REDIS_ADDR=redis:6379
      - RPA_BASE_URL=http://localhost:8081
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rpa-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  rpa-network:
    driver: bridge 